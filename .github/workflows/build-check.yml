name: Jekyll Build Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Build site
        run: bundle exec jekyll build --baseurl "/LJT-Homepage" --trace
        env:
          JEKYLL_ENV: production
      - name: Verify content
        run: |
          test -f _site/index.html
          test -f _site/publications/index.html
          for term in \
            "Junteng Liu" \
            "Hong Kong University of Science and Technology" \
            "Shanghai Jiao Tong University" \
            "HKUST NLP Group" \
            "Junxian He" \
            "Zifei Shan" \
            "Yu Cheng" \
            "MINIMAX" \
            "Tencent WXG" \
            "Shanghai AI Lab" \
            "Natural Language Processing" \
            "Machine Learning" \
            "LLM Reasoning and Reinforcement Learning" \
            "Hallucination in Vision-Language Models" \
            "LLM Truthfulness and Interpretability" \
            "SynLogic" \
            "On the Perception Bottleneck of VLMs for Chart Understanding" \
            "On the Universal Truthfulness Hyperplane Inside LLMs" \
            "In-Context Sharpness as Alerts" \
            "C-Eval" \
            "Composing Parameter-Efficient Modules with Arithmetic Operations" \
            "jliugi@connect.ust.hk" \
            "Vicent0205" \
            "junteng88716710" \
            "Scholar"; do
            echo "Checking: $term"
            grep -q "$term" _site/index.html || { echo "Missing: $term"; exit 1; }
          done
          for term in \
            "SynLogic" \
            "On the Perception Bottleneck of VLMs for Chart Understanding" \
            "On the Universal Truthfulness Hyperplane Inside LLMs" \
            "In-Context Sharpness as Alerts" \
            "C-Eval" \
            "Composing Parameter-Efficient Modules with Arithmetic Operations"; do
            echo "Checking publication: $term"
            grep -q "$term" _site/publications/index.html || { echo "Missing publication: $term"; exit 1; }
          done
          echo "All content checks passed."