# Workflow for building and deploying the personal Academic Pages site to GitHub Pages
name: Deploy Academic Pages template site to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0

      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true

      - name: Verify GitHub Pages deployment
        run: |
          curl --fail --silent --show-error --retry 6 --retry-delay 10 --retry-all-errors -o /dev/null -w "Homepage: %{http_code}\n" https://spaldingpitzenur80648.github.io/LJT-Homepage/
          curl --fail --silent --show-error --retry 6 --retry-delay 10 --retry-all-errors -o /dev/null -w "Publications: %{http_code}\n" https://spaldingpitzenur80648.github.io/LJT-Homepage/publications/